# ==============================================================================
# BedSense AI — System Configuration, Decision Thresholds & Logging Settings
# ==============================================================================

perception:
  detector_model: "models/yolo11n.pt" # YOLO-World / standard YOLO object detection model for bed auto-calibration
  bed_classes: ["hospital bed", "bed", "mattress", "couch"] # Open-vocabulary text prompts for bed detection
  pose_model: "models/yolo11l-pose.pt" # Ultralytics pose model (17 COCO keypoints)
  pose_conf: 0.20 # Minimum confidence to detect person/pose
  bed_conf: 0.12 # Minimum confidence to detect bed/furniture bounding box
  tracker_config: "bytetrack.yaml" # Built-in ByteTrack multi-object tracker
  target_fps: 10.0 # Target processing frame rate
  max_reacquire_dist: 180.0 # Pixel distance threshold for re-acquiring lost tracks

bed:
  # Bed-relation continuous affinity & 2D polygon overlap thresholds
  on_bed_threshold: 0.25 # Continuous multi-joint affinity threshold to consider resident 'in bed'
  off_bed_threshold: 0.12 # Continuous affinity threshold below which resident is considered 'off bed'
  in_bed_overlap_fallback: 0.30 # Bounding box polygon overlap fallback for on-bed classification
  out_of_bed_overlap_fallback: 0.15 # Bounding box polygon overlap fallback for off-bed classification

evidence:
  # Multi-attribute Biomechanical Evidence Accumulation Engine parameters
  min_keypoint_conf: 0.25 # Minimum confidence for individual landmark extraction
  minimum_confidence: 0.30 # Minimum winner score to output a definitive state vs UNKNOWN
  window_size: 5 # Moving temporal window size for multi-joint velocity calculation
  extended_knee_angle: 160.0 # Planar knee angle (hip-knee-ankle) > 160° indicates extended leg (lying/standing)
  bent_knee_angle: 130.0 # Planar knee angle < 130° indicates flexed knee (sitting)
  extended_hip_angle: 160.0 # Planar hip angle (shoulder-hip-knee) > 160° indicates extended hip (standing)
  bent_hip_angle: 130.0 # Planar hip angle < 130° indicates flexed hip (sitting)
  low_body_motion: 0.015 # Normalized velocity threshold for resting/stationary postures
  high_body_motion: 0.035 # Normalized velocity threshold for locomotion/walking motion
  torso_length_normalized_threshold: 1.25 # Normalized trunk scale ratio (torso_length / shoulder_width)

temporal:
  # Real-time streaming temporal engine & state machine rules
  min_segment_sec: 0.5 # Default minimum segment duration
  unknown_exit_sec: 0.20 # Ultra-fast 200ms confirmation when re-detecting resident from UNKNOWN
  unknown_enter_sec: 0.35 # Blip-resistant 350ms confirmation before committing UNKNOWN
  intra_bed_switch_sec: 0.30 # Fast 300ms confirmation for lying <-> sitting on bed
  min_exit_confirm_sec: 3.0 # Sustained walking/out_of_bed duration required to confirm clinical bed exit
  return_window_sec: 10.0 # Max time window to complete return transition to bed
  context_window_sec: 5.0 # Surrounding context history window [t - 5s, t + 5s] provided to Agent LLM

confidence:
  # Ambiguity scoring triggers
  mean_kpt_conf_ambiguous_threshold: 0.40 # Mean keypoint confidence < 0.4 triggers agent review
  edge_sit_hover_sec: 4.0 # Sustained time near bed edge boundary before triggering ambiguity

agent:
  # Agent LLM & VLM settings via Ollama
  enabled: true # Enable LangGraph Agent reasoning layer for clinical events & ambiguity
  ollama_base_url: "http://ollama:11434" # Ollama server endpoint in Docker network
  text_model: "qwen2.5:3b" # Text reasoning agent model (e.g. qwen2.5:3b, qwen3:4b)
  vlm_model: "qwen2.5vl:3b" # Vision language model for vlm_describe tool
  # P. S. that qwen2.5:3b and qwen2.5vl:3b are the default models thats automatically loaded on startup.
  # Run the following commands in the container to pull them if you want to change them: ollama pull qwen2.5:3b and ollama pull qwen2.5vl:3b
  tool_call_limit: 4 # Hard cap on tool calls per ambiguous segment
  timeout_sec: 30.0 # Request timeout in seconds
  temperature: 0.1 # Low temperature for deterministic structured JSON output

policy:
  # Clinical Alert policy rules
  edge_sit_monitor_sec: 10.0 # Sitting on bed edge > 10s -> MONITOR
  unknown_monitor_sec: 10.0 # Sustained UNKNOWN > 10s -> MONITOR
  out_of_bed_alert_sec: 10.0 # Prolonged absence from bed > 10s -> ALERT

artifacts:
  # Artifact export & recording settings
  save_video: true # Render and export annotated visualization MP4 video
  save_json: true # Export clinical reports (timeline.json, events.json, summary.json)
  save_telemetry: false # Record and export frame-by-frame telemetry.csv (disabled by default for speed & memory)

logging:
  # Logging verbosity level configuration
  # Options:
  #   - PROD   : Production mode (Default) — Full production lifecycle: starting, calibration, progress steps, state transitions, alerts, artifact export & completion
  #   - INFO   : Operational mode — Equivalent to PROD
  #   - AGENT  : Agent debug mode — Adds LangGraph reasoning loops, LLM structured prompts/responses & tool traces
  #   - DEBUG  : Full telemetry mode — Adds per-frame keypoint confidences & raw polygon overlap ratios
  #   - STATE  : State-only mode — Shows only live state transitions and clinical alert boxes
  default_level: "PROD"
